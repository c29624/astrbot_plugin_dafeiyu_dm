name: astrbot_plugin_dafeiyu_dm
display_name: 主动私聊——能调工具
desc: 她会真的主动来找你说话——时刻随机、方式像人。不是定时任务：你多久没回话、聊得多热、回她多快、放没放鸽子，都在影响她什么时候"想起你"；到点按概率掷骰，中了再随机抖动 10~40 分钟才发，掐不准表。她会记仇——秒回的人下次更容易被想，晾过她的会变矜持；聊嗨断线她最坐不住；周末/大小周/节假日想念不装矜持；你先道过晚安、她睡得再晚也必回应；你说"别发了"就真的安静。要更简单也有纯随机定时模式。但绝不会骚扰：睡着不发、深夜不发、连续被晾熔断、每日总量硬顶、评估时段自动跟作息——概率随你放开调，频率被死死夹住。晨起/睡前/静默想你三类触发各自带开关，四档触发（吃饭45/约定未赴90/聊嗨断线90/普通冷场120分钟+防掐表微抖），可选 AI 否决层（搭内心戏判断该不该发不另加调用）。主动消息可挂载任意已注册 llm_tool（三类独立开关+白名单+情景门控），LLM 带人设+上下文现场生成、归档进对话历史、拟人分段发送防风控；每个生成环节可选语料池直出（0 token）。默认发给 AstrBot 管理员，按 QQ 配称呼。仅私聊，群聊主动消息需求请开 Issue。
short_desc: 她会真的主动来找你——时刻随机不可预测（冷场+概率+抖动），越用越像真人（记仇/热度/节假日/道别对等）；睡着不打扰，频率硬顶绝不骚扰
