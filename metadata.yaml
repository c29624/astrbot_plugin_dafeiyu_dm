name: astrbot_plugin_dafeiyu_dm
display_name: 主动私聊
desc: 让 bot 主动来找你说话——晨起问候（醒后5~30分钟）、睡前晚安（入睡点前，已道过晚安自动换收尾话）、随机想念（每日N次时间窗）三类触发各自带开关。作息联动：读"随机睡觉"插件状态，她睡着绝不主动发消息（没装也能独立跑）。LLM带人设+最近聊天上下文现场生成（能接话茬）、每条主动消息归档进对话历史（她记得自己说过）、拟人分段发送（打字时间间隔防风控）、每日总量上限。默认发给 AstrBot 管理员（多配置文件按全部配置并集），按 QQ 配称呼。
short_desc: 晨起/睡前/随机想念三类主动私聊，作息联动睡着不打扰，上下文生成+拟人分段
