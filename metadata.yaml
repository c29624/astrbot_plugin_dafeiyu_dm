name: astrbot_plugin_dafeiyu_dm
display_name: 主动私聊——能调工具
desc: 让 bot 主动来找你说话——晨起问候、睡前晚安、随机想念三类触发各自带开关。v1.5 随机想念升级"静默想你"：不再定时抽签，而是按你多久没回话触发——说过吃饭/洗澡（45min）、约好回头找却没来（90min）、聊嗨突然断线（90min）、普通冷场（120min）四档起评，到点按概率掷骰（基础概率×日期冷却×回复反馈×热度档×离席折扣，有下限有每日微扰），中签后再随机抖动 10~40 分钟才发。想你的念头会"记仇"：秒回的人下次更容易被想，晾着她的会更矜持；大小周/节假日/调休日历让休息日不必装矜持。五道门兜底：睡着不发、出评估时段不发（自动跟作息浮动）、抑制词/熔断、每日上限硬顶7、事件翻篇终检（抖动期你回话当次作废）。可选 AI 否决层（搭内心戏顺带判断该不该发，不另加调用）。早晚安也带信号层：睡眠期发过言自动让位晨间冲刷、睡前聊过必收尾、连跳两天锚点必发、已道晚安换收尾话。主动消息可挂载任意已注册 llm_tool（三类独立开关+白名单+情景门控：吃饭情景只带点歌涂鸦这类由你配），LLM 带人设+上下文现场生成、归档进对话历史、拟人分段发送防风控。每个生成环节可选语料池直出（0 token）。默认发给 AstrBot 管理员，按 QQ 配称呼。仅私聊，群聊主动消息需求请开 Issue。
short_desc: 晨起/睡前/静默想你三类主动私聊：按你多久没回话+概率掷骰触发，作息联动睡着不打扰，五道门风控，可挂 llm 工具+情景门控
